[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/send-otp"
  to = "/.netlify/functions/send-otp"
  status = 200

[[redirects]]
  from = "/api/send-otp.php"
  to = "/.netlify/functions/send-otp"
  status = 200

[[redirects]]
  from = "/api/create-checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200

[[redirects]]
  from = "/api/create-checkout.php"
  to = "/.netlify/functions/create-checkout"
  status = 200
